<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마구니 감별사</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">

    <div class="header">
        <div class="mascot"><img src="/judge-mascot.svg" alt="판사" width="90"></div>
        <h1>마구니 감별사</h1>
        <p>보아하니, 마구니인 게로구나</p>
    </div>

    <div class="layout">
        <div>
            <div class="col-title">사건을 아뢰어라</div>
            <div class="card">
                <div class="field">
                    <label>어떤 사건인가?</label>
                    <input id="title" placeholder="예: 데이트 약속 펑크 사건">
                </div>
                <div class="pair">
                    <div class="field person-a"><label>A 이름</label><input id="personAName" placeholder="나"></div>
                    <div class="field person-b"><label>B 이름</label><input id="personBName" placeholder="상대방"></div>
                </div>
                <div class="field person-a">
                    <label>A의 입장 💙</label>
                    <textarea id="personAStory" placeholder="A는 어떤 상황이었고, 무엇이 억울한가"></textarea>
                </div>
                <div class="field person-b">
                    <label>B의 입장 ❤️</label>
                    <textarea id="personBStory" placeholder="B는 어떤 상황이었고, 무엇이 억울한가"></textarea>
                </div>
                <div class="field">
                    <label>증좌를 올리라 (선택)</label>
                    <input type="file" id="evidenceFiles" multiple accept="image/*,.txt" onchange="handleFiles(this.files)" class="file-input">
                    <div id="evidenceList" class="evidence-list"></div>
                </div>
                <div class="field">
                    <label>더 할말이 있는가?(선택)</label>
                    <textarea id="context" placeholder="당시 상황을 설명해보게"></textarea>
                </div>
            </div>
            <button class="submit" id="submitBtn" onclick="judge()">⚖️ 판결을 청하라</button>
        </div>

        <div>
            <div class="col-title">짐의 판결</div>
            <div class="card placeholder" id="placeholder">
                <div class="big"><img src="/judge-mascot.svg" alt="판사" width="72"></div>
                <p>왼편에 사정을 아뢰고<br>판결을 청하라</p>
            </div>
            <div class="result" id="result">
                <div class="card verdict-card">
                    <div class="verdict-emoji"><img src="/judge-mascot.svg" alt="판사" width="64"></div>
                    <h2>짐이 판결하노라</h2>
                    <div class="verdict-text" id="verdict"></div>
                </div>
                <div class="card">
                    <div class="fault-title">⚖️ 과실 비율</div>
                    <div class="fault-names"><span class="na" id="labelA"></span><span class="nb" id="labelB"></span></div>
                    <div class="bar"><div class="a" id="barA"></div><div class="b" id="barB"></div></div>
                </div>
                <div class="card info-box"><div class="ic">🔍</div><div><h3>짐이 살피건대</h3><p id="summary"></p></div></div>
                <div class="card info-box"><div class="ic">💡</div><div><h3>짐의 명을 받들라</h3><p id="advice"></p></div></div>
                <button class="again" onclick="newCase()">다음 사건을 들이라</button>
            </div>

            <div class="history">
                <div class="history-head">
                    <h2>📜 지난 판결</h2>
                    <button onclick="clearAll()">모두 거두라</button>
                </div>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

</div>

<script src="/app.js"></script>
</body>
</html>
